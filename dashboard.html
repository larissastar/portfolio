      <div class="badges">${daBadge(k.da)}</div>
    </div>`;
  }).join('');
}

function destroyCharts() {
  Object.keys(CHARTS).forEach(id => { try{ CHARTS[id].destroy(); }catch(e){} delete CHARTS[id]; });
}

function renderCharts(tab, org) {
  (CHART_CONFIGS[tab]?CHART_CONFIGS[tab](org):[]).forEach(cfg => {
    const canvas = document.getElementById(cfg.id);
    if (!canvas) return;
    const yTicks = { font:{size:11}, ...(cfg.opts.y.cb?{callback:cfg.opts.y.cb}:{}) };
    const opts = {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ grid:{color:'rgba(0,0,0,0.06)'}, ticks:{font:{size:11}} },
        y:{ grid:{color:'rgba(0,0,0,0.06)'}, ticks:yTicks, ...(cfg.opts.y.min!=null?{min:cfg.opts.y.min}:{}), ...(cfg.opts.y.max!=null?{max:cfg.opts.y.max}:{}) }
      }
    };
    if (cfg.opts.stackX) opts.scales.x.stacked = true;
    if (cfg.opts.stackY) opts.scales.y.stacked = true;
    CHARTS[cfg.id] = new Chart(canvas, { type:cfg.type, data:cfg.data, options:opts });
  });
}

function renderView(tab, org) {
  destroyCharts();
  const kpis = (DATA[tab]||{})[org] || (DATA[tab]||{}).All || [];
  const cfgs = CHART_CONFIGS[tab] ? CHART_CONFIGS[tab](org) : [];
  let html = `<div class="kpi-grid">${kpiCards(kpis)}</div>`;
  if (cfgs.length) {
    html += `<div class="chart-grid">`;
    cfgs.forEach(cfg => {
      const leg = cfg.legend.map(l=>`<span class="legend-item"><span class="legend-dot" style="background:${l.c};"></span>${l.l}</span>`).join('');
      html += `<div class="chart-panel"><div class="chart-title">${cfg.title}</div><div class="chart-sub">${cfg.sub}</div><div class="legend">${leg}</div><div style="position:relative;height:${cfg.h}px;"><canvas id="${cfg.id}" role="img" aria-label="${cfg.title}"></canvas></div></div>`;
    });
    html += `</div>`;
  }
  html += (EXTRA[tab]?EXTRA[tab]():'');
  document.getElementById('mainContent').innerHTML = html;
  setTimeout(()=>renderCharts(tab,org),60);
}

function buildTabs() {
  const bar = document.getElementById('tabBar');
  TABS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn'+(t.id===activeTab?' active':'');
    btn.textContent = t.label;
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = t.id;
      renderView(activeTab, orgCode);
    };
    bar.appendChild(btn);
  });
}

document.getElementById('orgSel').addEventListener('change', e=>{
  orgCode = e.target.value;
  renderView(activeTab, orgCode);
});

buildTabs();
renderView(activeTab, orgCode);
